name: "Deploy golang binary to release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  deploy-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build binary
        run: go build main.go

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: main